components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Project ─────────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, title, category, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: ["string", "null"]
        category:
          type: string
          description: "Residential | Hospitality | Commercial | Site Supervision"
        description:
          type: ["string", "null"]
        story:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        area:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        status:
          type: string
          description: "planning | in_progress | completed"
        featured:
          type: boolean
        coverImage:
          type: ["string", "null"]
        images:
          type: array
          items:
            type: string
        floorPlans:
          type: array
          items:
            type: string
        videos:
          type: array
          items:
            type: string
        materials:
          type: array
          items:
            type: string
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        clientName:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [title, category, status]
      properties:
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        description:
          type: string
        story:
          type: string
        location:
          type: string
        area:
          type: string
        year:
          type: integer
        status:
          type: string
        featured:
          type: boolean
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        floorPlans:
          type: array
          items:
            type: string
        videos:
          type: array
          items:
            type: string
        materials:
          type: array
          items:
            type: string
        latitude:
          type: number
        longitude:
          type: number
        clientName:
          type: string
        budget:
          type: string

    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        description:
          type: string
        story:
          type: string
        location:
          type: string
        area:
          type: string
        year:
          type: integer
        status:
          type: string
        featured:
          type: boolean
        coverImage:
          type: string
        images:
          type: array
          items:
            type: string
        floorPlans:
          type: array
          items:
            type: string
        videos:
          type: array
          items:
            type: string
        materials:
          type: array
          items:
            type: string
        latitude:
          type: number
        longitude:
          type: number
        clientName:
          type: string
        budget:
          type: string

    ProjectStats:
      type: object
      required: [total, byCategory, byStatus, featured]
      properties:
        total:
          type: integer
        featured:
          type: integer
        byCategory:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer
        byStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status:
                type: string
              count:
                type: integer

    # ── Service ─────────────────────────────────────────────────────────────────
    Service:
      type: object
      required: [id, title, description, sortOrder]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        icon:
          type: ["string", "null"]
        illustration:
          type: ["string", "null"]
        sortOrder:
          type: integer

    ServiceInput:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        illustration:
          type: string
        sortOrder:
          type: integer

    ServiceUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        illustration:
          type: string
        sortOrder:
          type: integer

    # ── Team ─────────────────────────────────────────────────────────────────────
